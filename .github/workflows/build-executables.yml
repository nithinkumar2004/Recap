name: Build Recap executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.12"
            artifact: recap-linux-x86_64
            executable: recap
          - os: windows-latest
            python: "3.12"
            artifact: recap-windows-x86_64
            executable: recap.exe
    defaults:
      run:
        working-directory: Recap

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Recap and PyInstaller
        run: python -m pip install --upgrade pip pyinstaller .
      - name: Build standalone executable
        run: >-
          pyinstaller --clean --noconfirm --onefile
          --name recap
          --collect-all rich
          --collect-all pydantic
          --collect-all pydantic_settings
          cli.py
      - name: Smoke-test executable
        shell: bash
        run: dist/${{ matrix.executable }} --help
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: Recap/dist/${{ matrix.executable }}
          if-no-files-found: error

  publish-release-assets:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: recap-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
