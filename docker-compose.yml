version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Release Captain
      - APP_ENV=development
      - DEBUG=True
      - DATABASE_URL=postgresql://captain:captain@db:5432/release_captain
      - REDIS_URL=redis://redis:6379/0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    depends_on:
      - db
      - redis
    volumes:
      - .:/workspace

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: captain
      POSTGRES_PASSWORD: captain
      POSTGRES_DB: release_captain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
